name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Build scanner
        run: cargo build --release --locked -p bar-cli
      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/bar dist/bar-x86_64-unknown-linux-gnu
          sha256sum dist/bar-x86_64-unknown-linux-gnu > dist/bar-x86_64-unknown-linux-gnu.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bar-x86_64-unknown-linux-gnu
          path: dist/*
      - name: Attach tagged release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
